name: Android build
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  buildv7l:
    name: ARMv7-L build (32-bit)
    runs-on: ubuntu-latest
    outputs:
      artifact_name: llamacpp-android21-armv7l
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout llama.cpp code
        uses: actions/checkout@v4
        with:
          repository: "ggml-org/llama.cpp"
          path: "llamasrc"
          fetch-depth: 1

      - name: Checkout subprocess.h code
        uses: actions/checkout@v4
        with:
          repository: "sheredom/subprocess.h"
          path: "subprocesshsrc"
          ref: d0833bf632601a190b30a33a4c71173c4d3c353f
          fetch-depth: 1

      - name: Checkout termux-elf-cleaner
        uses: actions/checkout@v4
        with:
          repository: "termux/termux-elf-cleaner"
          path: "termuxelfcleanersrc"
          fetch-depth: 1

      - name: Replace subprocess.h with compatible code
        run: "cp subprocesshsrc/subprocess.h llamasrc/vendor/sheredom/subprocess.h"

      - name: Patch llama.cpp
        run: "cd llamasrc && git apply ../patches/llamacpp/android/*.patch"

      - name: Prepare build
        run: |
          cd llamasrc && cmake -B build \
          -DANDROID_ABI="armeabi-v7a" \
          -DANDROID_PLATFORM="android-21" \
          -DBUILD_SHARED_LIBS=OFF \
          -DGGML_STATIC=ON \
          -DLLAMA_BUILD_COMMON=ON \
          -DLLAMA_BUILD_EXAMPLES=OFF \
          -DLLAMA_BUILD_TESTS=OFF \
          -DLLAMA_BUILD_SERVER=ON \
          -DLLAMA_BUILD_TOOLS=ON \
          -DLLAMA_CURL=OFF \
          -DLLAMA_HTTPLIB=ON \
          -DGGML_OPENMP=OFF \
          -DGGML_LLAMAFILE=ON \
          -DCMAKE_C_FLAGS="-march=armv8.7a+nodotprod+noi8mm -mfpu=neon-fp16 -mfloat-abi=softfp -U__ARM_FEATURE_DOTPROD -U__ARM_FEATURE_MATMUL_INT8" \
          -DCMAKE_CXX_FLAGS="-march=armv8.7a+nodotprod+noi8mm -mfpu=neon-fp16 -mfloat-abi=softfp -U__ARM_FEATURE_DOTPROD -U__ARM_FEATURE_MATMUL_INT8" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_EXE_LINKER_FLAGS="-s" \
          -DCMAKE_WARN_DEPRECATED=FALSE \
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake"

      - name: Build llama.cpp
        run: "cd llamasrc && cmake --build build --config Release --parallel 2"

      - name: Prepare termux-elf-cleaner build
        run: "cd termuxelfcleanersrc && cmake -B build -DCMAKE_BUILD_TYPE=Release"

      - name: Build termux-elf-cleaner
        run: "cd termuxelfcleanersrc && cmake --build build --config Release --parallel 2"

      - name: Clean binaries
        run: "for file in llamasrc/build/bin/*; do termuxelfcleanersrc/build/termux-elf-cleaner --api-level 21 $file; done"

      - name: Prepackage
        run: "mkdir ship && cp llamasrc/build/bin/* ship/"

      - name: "Publish artifact"
        uses: actions/upload-artifact@v4
        with:
          path: ship
          name: llamacpp-android21-armv7l
          retention-days: 1
          compression-level: 9
  buildv8:
    name: ARMv8-A build (64-bit)
    runs-on: ubuntu-latest
    outputs:
      artifact_name: llamacpp-android21-armv8
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout llama.cpp code
        uses: actions/checkout@v4
        with:
          repository: "ggml-org/llama.cpp"
          path: "llamasrc"
          fetch-depth: 1

      - name: Checkout subprocess.h code
        uses: actions/checkout@v4
        with:
          repository: "sheredom/subprocess.h"
          path: "subprocesshsrc"
          ref: d0833bf632601a190b30a33a4c71173c4d3c353f
          fetch-depth: 1

      - name: Checkout termux-elf-cleaner
        uses: actions/checkout@v4
        with:
          repository: "termux/termux-elf-cleaner"
          path: "termuxelfcleanersrc"
          fetch-depth: 1

      - name: Replace subprocess.h with compatible code
        run: "cp subprocesshsrc/subprocess.h llamasrc/vendor/sheredom/subprocess.h"

      - name: Patch llama.cpp
        run: "cd llamasrc && git apply ../patches/llamacpp/android/*.patch"

      - name: Prepare build
        run: |
          cd llamasrc && cmake -B build \
          -DANDROID_ABI="arm64-v8a" \
          -DANDROID_PLATFORM="android-21" \
          -DBUILD_SHARED_LIBS=OFF \
          -DGGML_STATIC=ON \
          -DLLAMA_BUILD_COMMON=ON \
          -DLLAMA_BUILD_EXAMPLES=OFF \
          -DLLAMA_BUILD_TESTS=OFF \
          -DLLAMA_BUILD_SERVER=ON \
          -DLLAMA_BUILD_TOOLS=ON \
          -DLLAMA_CURL=OFF \
          -DLLAMA_HTTPLIB=ON \
          -DGGML_OPENMP=OFF \
          -DGGML_LLAMAFILE=ON \
          -DCMAKE_C_FLAGS="-march=armv8-a+nodotprod+noi8mm+nosve+nosme -U__ARM_FEATURE_DOTPROD -U__ARM_FEATURE_MATMUL_INT8 -U__ARM_FEATURE_SVE -U__ARM_FEATURE_SME" \
          -DCMAKE_CXX_FLAGS="-march=armv8-a+nodotprod+noi8mm+nosve+nosme -U__ARM_FEATURE_DOTPROD -U__ARM_FEATURE_MATMUL_INT8 -U__ARM_FEATURE_SVE -U__ARM_FEATURE_SME" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_EXE_LINKER_FLAGS="-s" \
          -DCMAKE_WARN_DEPRECATED=FALSE \
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake"

      - name: Build llama.cpp
        run: "cd llamasrc && cmake --build build --config Release --parallel 2"

      - name: Prepare termux-elf-cleaner build
        run: "cd termuxelfcleanersrc && cmake -B build -DCMAKE_BUILD_TYPE=Release"

      - name: Build termux-elf-cleaner
        run: "cd termuxelfcleanersrc && cmake --build build --config Release --parallel 2"

      - name: Clean binaries
        run: "for file in llamasrc/build/bin/*; do termuxelfcleanersrc/build/termux-elf-cleaner --api-level 21 $file; done"

      - name: Prepackage
        run: "mkdir ship && cp llamasrc/build/bin/* ship/"

      - name: "Publish artifact"
        uses: actions/upload-artifact@v4
        with:
          path: ship
          name: llamacpp-android21-armv8
          retention-days: 1
          compression-level: 9